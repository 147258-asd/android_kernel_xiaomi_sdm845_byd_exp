name: Build Kali NetHunter Kernel for Mi 8 Pro (e

on:
  workflow_dispatch:

env:
  DEVICE: equuleus
  KERNEL_DIR: kernel-source
  DEFCONFIG: equuleus_defconfig
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-17.1
          path: ${{ env.KERNEL_DIR }}

      - name: Download Patches
        run: |
          mkdir patches
          cd patches
          curl -LO https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/main/patches/4.09/add-wifi-injection-4.14.patch
          curl -LO https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/main/patches/4.09/fix-ath9k-naming-conflict.patch

      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y git ccache bc build-essential zip

      - name: Toolchains
        run: |
          git clone --depth=1 https://mirrors.bfsu.edu.cn/git/AOSP/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r32 ~/gcc64 &
          git clone --depth=1 https://mirrors.bfsu.edu.cn/git/AOSP/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android-10.0.0_r32 ~/gcc32 &
          wait

      - name: Configure
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH=~/gcc64/bin:~/gcc32/bin:$PATH
          make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          echo "CONFIG_CC_STACKPROTECTOR=n" >> out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          echo "CONFIG_WIFI_INJECTION=y" >> out/.config
          make O=out ARCH=${{ env.ARCH }} olddefconfig

      - name: Build
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH=~/gcc64/bin:~/gcc32/bin:$PATH
          make -j$(nproc) O=out ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CC=gcc

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mi8Pro-Kernel
          path: ${{ env.KERNEL_DIR }}/out/arch/${{ env.ARCH }}/boot/Image.gz-dtb
