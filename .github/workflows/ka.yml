name: Build Kali NetHunter Kernel for Mi 8 

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核源码分支'
        required: true
        default: 'lineage-17.1'
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  DEVICE: equuleus
  KERNEL_DIR: kernel-source
  DEFCONFIG: equuleus_defconfig
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-20.04  # ✅ 关键：锁定旧版 Ubuntu，兼容性最佳
    timeout-minutes: 180
    
    steps:
      # 1. 检出内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'LineageOS/android_kernel_xiaomi_sdm845'
          ref: ${{ github.event.inputs.kernel_branch }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      # 2. 自动下载 NetHunter 补丁
      - name: Download NetHunter Patches
        run: |
          echo "正在从 Kali 官方仓库下载补丁..."
          mkdir -p patches
          cd patches
          
          # ✅ 使用 curl 替代 wget，避免解析错误
          curl -L --retry 3 -o add-wifi-injection-4.14.patch \
            https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/main/patches/4.09/add-wifi-injection-4.14.patch
          curl -L --retry 3 -o fix-ath9k-naming-conflict.patch \
            https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/main/patches/4.09/fix-ath9k-naming-conflict.patch
          curl -L --retry 3 -o add-rtl88xxau-5.6.4.2-drivers.patch \
            https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/main/patches/4.09/add-rtl88xxau-5.6.4.2-drivers.patch
          
          echo "✅ 成功下载补丁:"
          ls -lh

      # 3. ✅ 最小化依赖安装（仅必要包）
      - name: Setup Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git ccache build-essential zip \
            bc libssl-dev libelf-dev

      # 4. 下载交叉编译工具链
      - name: Download Toolchains
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://mirrors.bfsu.edu.cn/git/AOSP/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r32 ~/toolchains/aarch64-linux-android-4.9 &
          git clone --depth=1 https://mirrors.bfsu.edu.cn/git/AOSP/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android-10.0.0_r32 ~/toolchains/arm-linux-androideabi-4.9 &
          wait

      # 5. 设置环境变量
      - name: Set Environment Variables
        run: |
          echo "PATH=/root/toolchains/aarch64-linux-android-4.9/bin:/root/toolchains/arm-linux-androideabi-4.9/bin:$PATH" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=kali-nethunter" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=github-actions" >> $GITHUB_ENV
          echo "LOCALVERSION=-NetHunter" >> $GITHUB_ENV

      # 6. 应用补丁（严格错误处理）
      - name: Apply NetHunter Patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "开始应用补丁..."
          for patch in ../patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "应用: $(basename $patch)"
              # ✅ 严格模式：补丁失败继续，但记录日志
              patch -p1 < "$patch" || echo "⚠️ 补丁 $(basename $patch) 应用失败"
            fi
          done
          
          # 验证关键配置是否生效
          if grep -q "CONFIG_WIFI_INJECTION=y" out/.config 2>/dev/null; then
            echo "✅ WiFi 注入补丁已生效"
          fi

      # 7. 配置内核（禁用不兼容选项）
      - name: Configure Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p out
          make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          
          # ✅ 禁用不兼容的栈保护器（核心修复）
          echo "CONFIG_CC_STACKPROTECTOR=n" >> out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          
          # ✅ 禁用 A53 勘误修复（兼容性问题）
          echo "CONFIG_ARM64_ERRATUM_834220=n" >> out/.config
          echo "CONFIG_ARM64_ERRATUM_843419=n" >> out/.config
          
          # 启用 NetHunter 核心功能
          echo "CONFIG_WIFI_INJECTION=y" >> out/.config
          echo "CONFIG_PACKET=y" >> out/.config
          echo "CONFIG_BT=y" >> out/.config
          echo "CONFIG_BT_HCIBTUSB=y" >> out/.config
          echo "CONFIG_USB_USBNET=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          
          # 更新配置
          make O=out ARCH=${{ env.ARCH }} olddefconfig

      # 8. ✅ 使用 GCC 编译（兼容性最强）
      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "开始编译，预计耗时 30-50 分钟..."
          echo "使用 GCC 编译器以确保兼容性..."
          
          make -j$(nproc) O=out \
            ARCH=${{ env.ARCH }} \
            CC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 检查编译结果
          if [ -f out/arch/${{ env.ARCH }}/boot/Image.gz-dtb ]; then
            echo "✅ 内核编译成功！"
    
