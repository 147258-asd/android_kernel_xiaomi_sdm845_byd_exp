name: Build Kali NetHunter Kernel for Mi 8 Pro (equuleus)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核源码分支'
        required: true
        default: 'lineage-17.1'
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  DEVICE: equuleus
  KERNEL_DIR: kernel-source
  DEFCONFIG: equuleus_defconfig
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      # Step 1: 检出内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          repository: 'LineageOS/android_kernel_xiaomi_sdm845'
          ref: ${{ github.event.inputs.kernel_branch }}
          path: ${{ env.KERNEL_DIR }}

      # Step 2: 自动下载 NetHunter 补丁（关键步骤）
      - name: Download NetHunter Patches
        run: |
          echo "正在从 Kali 官方仓库下载补丁..."
          mkdir -p patches
          cd pat
